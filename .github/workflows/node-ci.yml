name: Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      node_ci_required:
        description: 'Fail workflow if package.json is missing (true/false)'
        required: false
        default: 'true'

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      NODE_CI_REQUIRED: ${{ github.event.inputs.node_ci_required || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for package.json
        id: check_pkg
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail or skip if no package.json
        if: steps.check_pkg.outputs.found == 'false'
        run: |
          if [ "${NODE_CI_REQUIRED}" = "true" ]; then
            echo "ERROR: No package.json found in repository — failing Node CI." >&2
            exit 1
          else
            echo "No package.json found, but Node CI is not required — continuing."
            exit 0
          fi

      - name: Setup Node.js
        if: steps.check_pkg.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_pkg.outputs.found == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        if: steps.check_pkg.outputs.found == 'true'
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No npm lint script defined — skipping lint step."
          fi

      - name: Build
        if: steps.check_pkg.outputs.found == 'true'
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No npm build script defined — skipping build step."
          fi

      - name: Run tests
        if: steps.check_pkg.outputs.found == 'true'
        run: |
          if npm run | grep -q " test"; then
            npm test
          else
            echo "No npm test script defined — consider adding one to package.json" && exit 0
          fi

      - name: Upload JUnit report
        if: steps.check_pkg.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: coverage/junit/junit.xml

      - name: Coverage check
        if: steps.check_pkg.outputs.found == 'true'
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            # Check for 100% coverage on statements
            COVERAGE=$(grep -o '"pct":[0-9.]*' coverage/coverage-summary.json | head -1 | cut -d':' -f2)
            if (( $(echo "$COVERAGE < 100" | bc -l) )); then
              echo "Coverage is ${COVERAGE}%, required 100% - failing"
              exit 1
            fi
            echo "Coverage check passed: ${COVERAGE}%"
          fi
