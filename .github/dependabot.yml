version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Allow automerging for patch/minor updates if you want (disabled here).
    # automerged_updates:
    #   enable: true
    #   merge_type: "squash"
